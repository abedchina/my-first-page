<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שולח חיישנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* layout: one narrow column for the phone: code, start button, live compass */
  :root{
    color-scheme:dark;
    --bg:#0d1117; --panel:#151b24; --panel2:#1c2430; --line:#2a3544;
    --text:#e9eef5; --muted:#8b98ab; --accent:#4dd0ff; --green:#46e08a; --amber:#ffc24d; --north:#ff4d4d;
    --font:'Assistant',system-ui,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
  .phone{max-width:480px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px;text-align:center}
  h1{margin:0;font-size:26px;font-weight:800}
  .muted{color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  #code{font-family:var(--mono);font-size:40px;text-align:center;letter-spacing:.3em;width:100%;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--text)}
  #code:focus{outline:none;border-color:var(--accent)}
  #startBtn{font-family:inherit;font-size:22px;font-weight:800;padding:20px;border:none;background:linear-gradient(135deg,#1e88e5,#4dd0ff);color:#04121c;border-radius:18px;cursor:pointer}
  #startBtn:disabled{opacity:.7}
  .status{align-self:center;display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:6px 14px;border-radius:20px;background:var(--panel2)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);animation:pulse 1.4s infinite}
  .status.on .dot{background:var(--green)}
  @keyframes pulse{50%{opacity:.35}}
  #arrow{width:130px;height:130px;margin:0 auto;transition:transform .15s linear}
  #heading{font-family:var(--mono);font-size:64px;font-weight:700}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:right;font-size:15px}
  .kv span:nth-child(odd){color:var(--muted)}
  .kv span:nth-child(even){font-family:var(--mono);direction:ltr;text-align:right}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <h1>📱 שולח חיישנים למחשב</h1>
  <div class="card">
    <div class="muted" style="margin-bottom:8px">הקלד את הקוד שמופיע במסך המחשב</div>
    <input id="code" inputmode="numeric" maxlength="5" placeholder="00000" autocomplete="off">
  </div>
  <button id="startBtn">▶️ הפעל חיישנים</button>
  <div class="status" id="st"><span class="dot"></span><span id="stText">עוד לא מחובר</span></div>
  <svg id="arrow" viewBox="-50 -50 100 100"><circle r="46" fill="none" stroke="#2a3544" stroke-width="4"/><polygon points="0,-40 -14,10 0,2 14,10" fill="#ff4d4d"/><polygon points="0,40 -14,10 0,2 14,10" fill="#8b98ab"/></svg>
  <div id="heading">---°</div>
  <div class="muted" id="info">החץ האדום מצביע לצפון. השאר את הדף פתוח והמסך דלוק.</div>
  <div class="kv card" id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const s = {};      // latest sensor values
let client = null, sent = 0;

const fromLink = new URLSearchParams(location.search).get('code');
if (fromLink) $('code').value = fromLink;

function status(on, txt){ $('st').classList.toggle('on', on); $('stText').textContent = txt; }

$('startBtn').onclick = async () => {
  const code = $('code').value.trim();
  if (!/^\d{5}$/.test(code)){ status(false, '⚠️ צריך קוד של 5 ספרות מהמחשב'); $('code').focus(); return; }

  // iPhone asks permission for motion sensors, only from a tap
  try{
    if (typeof DeviceOrientationEvent?.requestPermission === 'function') await DeviceOrientationEvent.requestPermission();
    if (typeof DeviceMotionEvent?.requestPermission === 'function') await DeviceMotionEvent.requestPermission();
  }catch{ $('info').textContent = '⚠️ לא התקבלה הרשאה לחיישנים'; }

  const onOrient = e => {
    if (e.webkitCompassHeading != null) s.h = e.webkitCompassHeading;          // iPhone
    else if (e.absolute && e.alpha != null) s.h = (360 - e.alpha) % 360;      // Android
    s.b = e.beta; s.g = e.gamma;
  };
  if ('ondeviceorientationabsolute' in window) addEventListener('deviceorientationabsolute', onOrient);
  else addEventListener('deviceorientation', onOrient);
  addEventListener('devicemotion', e => {
    const a = e.accelerationIncludingGravity || {}, r = e.rotationRate || {};
    s.ax = a.x; s.ay = a.y; s.az = a.z; s.ra = r.alpha; s.rb = r.beta; s.rg = r.gamma;
  });
  navigator.geolocation?.watchPosition(p => {
    s.lat = p.coords.latitude; s.lon = p.coords.longitude; s.acc = p.coords.accuracy;
    s.spd = p.coords.speed; s.alt = p.coords.altitude;
  }, () => {}, { enableHighAccuracy: true });
  try{
    const bat = await navigator.getBattery();
    const upd = () => { s.bat = Math.round(bat.level * 100); s.chg = bat.charging; };
    upd(); bat.onlevelchange = bat.onchargingchange = upd;
  }catch{}
  try{ await navigator.wakeLock?.request('screen'); }catch{}

  $('startBtn').textContent = '✅ החיישנים פועלים';
  $('startBtn').disabled = true;
  $('code').disabled = true;

  status(false, 'מתחבר...');
  client = mqtt.connect(BROKER, { reconnectPeriod: 2000 });
  client.on('connect', () => status(true, 'מחובר ✓ שולח למחשב ' + code));
  client.on('offline', () => status(false, 'אין חיבור לאינטרנט, מנסה שוב...'));

  setInterval(() => {
    if (client.connected){ client.publish('innotech-phone-sensors/' + code, JSON.stringify(s)); sent++; }
    if (s.h != null){
      $('heading').textContent = Math.round(s.h) + '°';
      $('arrow').style.transform = `rotate(${-s.h}deg)`;
    }
    const f = v => v == null ? '–' : (+v).toFixed(1);
    $('list').innerHTML = `<span>הטיה β/γ</span><span>${f(s.b)} / ${f(s.g)}</span>
      <span>תאוצה</span><span>${f(s.ax)}, ${f(s.ay)}, ${f(s.az)}</span>
      <span>GPS</span><span>${s.lat ? s.lat.toFixed(5) + ', ' + s.lon.toFixed(5) : '–'}</span>
      <span>סוללה</span><span>${s.bat ?? '–'}%</span>
      <span>נשלחו</span><span>${sent}</span>`;
  }, 70);
};
</script>
</body>
</html>
