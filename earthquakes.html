<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת רעידות אדמה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --glass:rgba(10,16,38,.55); --glass2:rgba(255,255,255,.07); --border:rgba(255,255,255,.14);
    --text:#eef2ff; --muted:#9aa6cf; --red:#ff3b3b; --red2:#ff7a59; --yellow:#ffd23f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:'Heebo',system-ui,sans-serif}
  #globe{position:fixed;inset:0}

  .glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.45)}

  /* top bar */
  header{position:fixed;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 20px;z-index:5}
  .brand{display:flex;align-items:center;gap:12px}
  .brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:.3px}
  .brand small{display:block;font-size:12px;color:var(--muted);font-weight:400}
  .pulse{width:14px;height:14px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,59,.8)}70%{box-shadow:0 0 0 16px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}

  .stats{display:flex;gap:10px;margin-inline-start:auto}
  .stat{background:var(--glass2);border:1px solid var(--border);border-radius:14px;padding:6px 16px;text-align:center;min-width:96px}
  .stat b{display:block;font-size:26px;font-weight:900;line-height:1.1}
  .stat span{font-size:11px;color:var(--muted)}
  .stat.hot{background:linear-gradient(135deg,rgba(255,59,59,.35),rgba(255,122,89,.15));border-color:rgba(255,90,90,.5)}
  .stat.hot b{font-size:34px;color:#fff;text-shadow:0 0 18px rgba(255,59,59,.9)}

  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select,button{font-family:inherit;font-size:13px;background:var(--glass2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px 12px;cursor:pointer;transition:.2s}
  select option{background:#111836}
  button:hover,select:hover{background:rgba(255,255,255,.16)}
  button.on{background:rgba(255,59,59,.35);border-color:rgba(255,90,90,.6)}

  /* alert panel on the right */
  #panel{position:fixed;top:120px;right:16px;bottom:16px;width:350px;display:flex;flex-direction:column;z-index:5;overflow:hidden}
  #panel h2{margin:0;padding:16px 18px 10px;font-size:17px;display:flex;align-items:center;gap:8px}
  #panel h2 .count{margin-inline-start:auto;font-size:12px;background:var(--red);border-radius:20px;padding:2px 10px}
  #updated{font-size:11px;color:var(--muted);padding:0 18px 10px;border-bottom:1px solid var(--border)}
  #items{overflow-y:auto;flex:1;padding:8px}
  #items::-webkit-scrollbar{width:6px}
  #items::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
  .item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer;transition:.2s;margin-bottom:4px}
  .item:hover,.item.sel{background:rgba(255,255,255,.1)}
  .item.new{animation:flash 2.5s}
  @keyframes flash{from{background:rgba(255,59,59,.45)}to{background:transparent}}
  .mag{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;box-shadow:0 0 14px rgba(255,59,59,.55)}
  .info{min-width:0;flex:1}
  .place{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .tsunami{color:var(--yellow);font-weight:600}

  /* magnitude label above each quake on the globe */
  .lbl{transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:rgba(255,40,40,.9);color:#fff;font-weight:900;font-size:12px;padding:2px 7px;border-radius:8px;white-space:nowrap;box-shadow:0 0 12px rgba(255,40,40,.8);position:relative;margin-top:-6px}
  .lbl::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-bottom:0;border-top-color:rgba(255,40,40,.9)}
  .lbl.big{font-size:15px;padding:3px 9px}

  /* details card */
  #card{position:fixed;left:16px;bottom:16px;width:320px;padding:18px;z-index:5;display:none}
  #card.show{display:block;animation:up .35s}
  @keyframes up{from{opacity:0;transform:translateY(20px)}}
  #card .big{font-size:46px;font-weight:900;color:#fff;text-shadow:0 0 24px rgba(255,59,59,.9);line-height:1}
  #card .place{font-size:16px;margin:8px 0;white-space:normal}
  #card .row{font-size:13px;color:var(--muted);margin:4px 0}
  #card a{color:#8fc1ff;font-size:13px}
  #card .x{position:absolute;top:10px;left:12px;background:none;border:none;font-size:18px;padding:4px}

  .scene-tooltip{font-family:'Heebo',sans-serif!important;direction:rtl}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;z-index:99;font-size:20px;transition:opacity .6s}
  #loading.hide{opacity:0;pointer-events:none}

  @media (max-width:800px){
    header{top:8px;left:8px;right:8px;padding:10px 12px;gap:10px}
    .brand h1{font-size:17px}
    .stats{margin-inline-start:0;width:100%}
    .stat{flex:1;min-width:0;padding:4px 6px}
    .stat b{font-size:20px}.stat.hot b{font-size:24px}
    #panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:36vh}
    #card{left:8px;right:8px;width:auto;bottom:calc(36vh + 16px)}
  }
</style>
</head>
<body>
<div id="loading">🌍 טוען את כדור הארץ...</div>
<div id="globe"></div>

<header class="glass">
  <div class="brand"><div class="pulse"></div><div><h1>רעידות אדמה בזמן אמת</h1><small>נתונים חיים מ-USGS · מתעדכן כל דקה</small></div></div>
  <div class="controls">
    <select id="period">
      <option value="hour">שעה אחרונה</option>
      <option value="day" selected>24 שעות</option>
      <option value="week">שבוע אחרון</option>
    </select>
    <select id="minmag">
      <option value="all">כל העוצמות</option>
      <option value="2.5" selected>עוצמה 2.5+</option>
      <option value="4.5">עוצמה 4.5+</option>
      <option value="significant">משמעותיות בלבד</option>
    </select>
    <button id="israel">🇮🇱 ישראל</button>
    <button id="spin" class="on">🔄 סיבוב</button>
  </div>
  <div class="stats">
    <div class="stat hot"><b id="sLast">–</b><span>עוצמה אחרונה</span></div>
    <div class="stat"><b id="sMax">–</b><span>החזקה ביותר</span></div>
    <div class="stat"><b id="sCount">–</b><span>רעידות</span></div>
  </div>
</header>

<aside id="panel" class="glass">
  <h2>🔔 התראות אחרונות <span class="count" id="pCount">0</span></h2>
  <div id="updated">טוען...</div>
  <div id="items"></div>
</aside>

<div id="card" class="glass"></div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
<script>
const IMG = 'https://cdn.jsdelivr.net/npm/three-globe@2.27.2/example/img/';
const $ = id => document.getElementById(id);
let quakes = [], knownIds = new Set(), firstLoad = true, selectedId = null;

const globe = Globe()($('globe'))
  .globeImageUrl(IMG + 'earth-blue-marble.jpg')
  .bumpImageUrl(IMG + 'earth-topology.png')
  .backgroundImageUrl(IMG + 'night-sky.png')
  .atmosphereColor('#4da3ff')
  .atmosphereAltitude(0.22)
  // red dots
  .pointLat('lat').pointLng('lng')
  .pointAltitude(d => 0.01 + d.mag * 0.012)
  .pointRadius(d => 0.25 + Math.max(d.mag, 0) * 0.12)
  .pointColor(d => d.id === selectedId ? '#ffffff' : color(d.mag))
  .pointResolution(16)
  .pointLabel(d => `<div style="background:rgba(10,16,38,.9);padding:8px 12px;border-radius:10px;border:1px solid #ff5050">
      <b style="color:#ff6b6b;font-size:18px">עוצמה ${d.mag.toFixed(1)}</b><br><span dir="ltr">${esc(d.place)}</span><br>${timeAgo(d.time)}</div>`)
  .onPointClick(d => select(d))
  // pulsing red rings
  .ringLat('lat').ringLng('lng')
  .ringColor(() => t => `rgba(255,50,50,${1 - t})`)
  .ringMaxRadius(d => 1.5 + Math.max(d.mag, 0) * 0.9)
  .ringPropagationSpeed(d => 1 + d.mag * 0.3)
  .ringRepeatPeriod(d => 1400 - Math.min(d.mag, 7) * 120)
  // magnitude labels above the quakes
  .htmlLat('lat').htmlLng('lng')
  .htmlAltitude(d => 0.02 + d.mag * 0.012)
  .htmlElement(d => {
    const el = document.createElement('div');
    el.className = 'lbl' + (d.mag >= 6 ? ' big' : '');
    el.textContent = d.mag.toFixed(1);
    el.onclick = () => select(d);
    return el;
  });

globe.controls().autoRotate = true;
globe.controls().autoRotateSpeed = 0.45;
globe.pointOfView({lat: 25, lng: 35, altitude: 2.3}, 0);

function resize(){ globe.width(innerWidth).height(innerHeight); }
addEventListener('resize', resize); resize();

function color(m){
  if (m >= 6) return '#ff1a1a';
  if (m >= 4.5) return '#ff3b3b';
  if (m >= 2.5) return '#ff6a4d';
  return '#ff9a7a';
}
function timeAgo(t){
  const s = Math.floor((Date.now() - t) / 1000);
  if (s < 60) return 'לפני ' + s + ' שניות';
  const m = Math.floor(s / 60); if (m < 60) return 'לפני ' + m + ' דקות';
  const h = Math.floor(m / 60); if (h < 24) return 'לפני ' + h + ' שעות';
  return 'לפני ' + Math.floor(h / 24) + ' ימים';
}
const fmtDate = t => new Date(t).toLocaleString('he-IL');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load(){
  const url = `https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/${$('minmag').value}_${$('period').value}.geojson`;
  try{
    const data = await (await fetch(url)).json();
    quakes = data.features.map(f => ({
      id: f.id, mag: f.properties.mag ?? 0, place: f.properties.place || 'מיקום לא ידוע',
      time: f.properties.time, url: f.properties.url, tsunami: f.properties.tsunami,
      lng: f.geometry.coordinates[0], lat: f.geometry.coordinates[1], depth: f.geometry.coordinates[2]
    })).sort((a, b) => b.time - a.time);
    render();
    $('updated').textContent = 'עודכן לאחרונה: ' + new Date().toLocaleTimeString('he-IL');
  }catch(e){
    $('updated').textContent = '⚠️ שגיאה בטעינת הנתונים, מנסה שוב בעוד דקה';
  }
  $('loading').classList.add('hide');
}

function render(){
  globe.pointsData(quakes);
  // rings only for the stronger / recent quakes to keep it fast
  globe.ringsData(quakes.filter(q => q.mag >= 4 || Date.now() - q.time < 3 * 3600e3).slice(0, 80));
  // labels: strongest quakes, so the globe stays readable
  globe.htmlElementsData([...quakes].sort((a, b) => b.mag - a.mag).slice(0, 40));

  const items = $('items');
  items.innerHTML = '';
  quakes.slice(0, 60).forEach(q => {
    const div = document.createElement('div');
    div.className = 'item' + (q.id === selectedId ? ' sel' : '') + (!firstLoad && !knownIds.has(q.id) ? ' new' : '');
    div.innerHTML = `<div class="mag" style="background:${color(q.mag)}">${q.mag.toFixed(1)}</div>
      <div class="info"><div class="place">${esc(q.place)}</div>
      <div class="meta">${timeAgo(q.time)}${q.tsunami ? ' · <span class="tsunami">🌊 צונאמי</span>' : ''}</div></div>`;
    div.onclick = () => select(q);
    items.appendChild(div);
  });
  if (!quakes.length) items.innerHTML = '<div class="item">אין רעידות בטווח שנבחר 🙂</div>';

  const mags = quakes.map(q => q.mag);
  $('sLast').textContent = quakes.length ? mags[0].toFixed(1) : '–';
  $('sMax').textContent = quakes.length ? Math.max(...mags).toFixed(1) : '–';
  $('sCount').textContent = quakes.length;
  $('pCount').textContent = Math.min(quakes.length, 60);

  knownIds = new Set(quakes.map(q => q.id));
  firstLoad = false;
}

function select(q){
  selectedId = q.id;
  setSpin(false);
  globe.pointOfView({lat: q.lat, lng: q.lng, altitude: 1.2}, 1500);
  globe.pointColor(globe.pointColor()); // refresh colors
  $('card').innerHTML = `<button class="x" onclick="closeCard()">✕</button>
    <div class="big">${q.mag.toFixed(1)}</div>
    <div class="place" dir="ltr">${esc(q.place)}</div>
    <div class="row">🕒 ${fmtDate(q.time)} (${timeAgo(q.time)})</div>
    <div class="row">📏 עומק: ${q.depth.toFixed(1)} ק"מ</div>
    <div class="row">📍 ${q.lat.toFixed(2)}, ${q.lng.toFixed(2)}</div>
    ${q.tsunami ? '<div class="row tsunami">🌊 אזהרת צונאמי</div>' : ''}
    <a href="${esc(q.url)}" target="_blank">פרטים מלאים ב-USGS ←</a>`;
  $('card').classList.add('show');
  document.querySelectorAll('.item').forEach((el, i) => el.classList.toggle('sel', quakes[i]?.id === q.id));
}
function closeCard(){
  $('card').classList.remove('show');
  selectedId = null;
  globe.pointColor(globe.pointColor());
}
function setSpin(on){
  globe.controls().autoRotate = on;
  $('spin').classList.toggle('on', on);
}

$('period').onchange = load;
$('minmag').onchange = load;
$('spin').onclick = () => setSpin(!globe.controls().autoRotate);
$('israel').onclick = () => { setSpin(false); globe.pointOfView({lat: 31.5, lng: 35, altitude: 0.6}, 1800); };

load();
setInterval(load, 60000);
</script>
</body>
</html>
